openapi: 3.0.1
info:
  title: FlagSentinel API
  version: 1.0.0
  description: API para gestión, evaluación y administración de Feature Flags

servers:
  - url: http://localhost:8080

tags:
  - name: Auth
    description: Autenticación y generación de tokens JWT
  - name: Feature Flags
    description: Gestión de feature flags
  - name: Rules
    description: Gestión de reglas de evaluación
  - name: Evaluation
    description: Evaluación de flags
  - name: Users
    description: Gestión de usuarios
  - name: SDK Bootstrap
    description: Endpoints para inicialización del SDK

paths:

  ############################################
  # SDK BOOTSTRAP (SEPARADO)
  ############################################
  /api/bootstrap/flags:
    get:
      tags: [ SDK Bootstrap ]
      summary: Obtener todas las flags para inicialización del SDK
      description: Devuelve todas las feature flags con solo IDs de reglas.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Flags cargadas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapFeatureFlagResponse'

  /api/bootstrap/rules:
    get:
      tags: [ SDK Bootstrap ]
      summary: Obtener todas las reglas para inicialización del SDK
      description: Devuelve todas las reglas completas para inicializar el SDK.
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Reglas cargadas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BootstrapRuleResponse'

  ############################################
  # AUTH
  ############################################
  /api/auth/login:
    post:
      tags: [ Auth ]
      summary: Login de usuario
      description: Autentica al usuario y devuelve un token JWT válido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token generado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas

  ############################################
  # FEATURE FLAGS CRUD
  ############################################
  /api/flags:
    post:
      tags: [ Feature Flags ]
      summary: Crear un feature flag
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeatureFlagRequest'
      responses:
        '200':
          description: Feature flag creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'

    get:
      tags: [ Feature Flags ]
      summary: Obtener todos los feature flags
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Lista de feature flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeatureFlagResponse'

  /api/flags/paged:
    get:
      tags: [ Feature Flags ]
      summary: Obtener feature flags paginados
      description: Devuelve una página de feature flags según los parámetros de paginación.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Página de feature flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageFeatureFlagResponse'

  /api/flags/{id}:
    get:
      tags: [ Feature Flags ]
      summary: Obtener un feature flag por ID
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Feature flag encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'
        '404':
          description: No encontrado

    put:
      tags: [ Feature Flags ]
      summary: Actualizar un feature flag
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeatureFlagRequest'
      responses:
        '200':
          description: Feature flag actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlagResponse'

    delete:
      tags: [ Feature Flags ]
      summary: Eliminar un feature flag
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Eliminado correctamente

  ############################################
  # FLAG EVALUATION
  ############################################
  /api/flags/evaluate:
    post:
      tags: [ Evaluation ]
      summary: Evaluar un feature flag
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagEvaluationRequest'
      responses:
        '200':
          description: Resultado de la evaluación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagEvaluationResponse'

  ############################################
  # RULES CRUD
  ############################################
  /api/rules:
    post:
      tags: [ Rules ]
      summary: Crear una regla
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleRequest'
      responses:
        '200':
          description: Regla creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'

    get:
      tags: [ Rules ]
      summary: Obtener todas las reglas
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Lista de reglas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleResponse'

  /api/rules/{id}:
    get:
      tags: [ Rules ]
      summary: Obtener una regla por ID
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Regla encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'

    put:
      tags: [ Rules ]
      summary: Actualizar una regla
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRuleRequest'
      responses:
        '200':
          description: Regla actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'

    delete:
      tags: [ Rules ]
      summary: Eliminar una regla
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Eliminado correctamente

############################################
# COMPONENTS
############################################
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    ############################################
    # BOOTSTRAP DTOs (ACTUALIZADOS)
    ############################################

    BootstrapFeatureFlagDTO:
      type: object
      properties:
        flagCode:
          type: string
        enabled:
          type: boolean
        rules:
          type: array
          items:
            type: integer
            format: int64

    BootstrapFeatureFlagResponse:
      type: object
      properties:
        flags:
          type: array
          items:
            $ref: '#/components/schemas/BootstrapFeatureFlagDTO'

    BootstrapRuleResponse:
      type: object
      properties:
        id:
          type: integer
        attribute:
          type: string
        operator:
          type: string
        value:
          type: string

    ############################################
    # RESTO DE DTOs (SIN CAMBIOS)
    ############################################

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string

    CreateFeatureFlagRequest:
      type: object
      properties:
        flagCode:
          type: string
        enabled:
          type: boolean
        ruleCodes:
          type: array
          items:
            type: integer

    UpdateFeatureFlagRequest:
      type: object
      properties:
        flagCode:
          type: string
        enabled:
          type: boolean
        ruleCodes:
          type: array
          items:
            type: integer

    FeatureFlagResponse:
      type: object
      properties:
        id:
          type: integer
        flagCode:
          type: string
        enabled:
          type: boolean
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleResponse'

    RuleDTO:
      type: object
      properties:
        id:
          type: integer
        attribute:
          type: string
        operator:
          type: string
        value:
          type: string

    RuleResponse:
      type: object
      properties:
        id:
          type: integer
        attribute:
          type: string
        operator:
          type: string
        value:
          type: string

    FlagEvaluationRequest:
      type: object
      properties:
        key:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string

    FlagEvaluationResponse:
      type: object
      properties:
        key:
          type: string
        enabled:
          type: boolean
        reason:
          type: string

    CreateRuleRequest:
      type: object
      properties:
        attribute:
          type: string
        operator:
          type: string
        value:
          type: string

    UpdateRuleRequest:
      type: object
      properties:
        attribute:
          type: string
        operator:
          type: string
        value:
          type: string

    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        role:
          type: string

    UserResponse:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string

    RuleOperatorDTO:
      type: object
      properties:
        code:
          type: string
        label:
          type: string

    PageRuleResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/RuleResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    PageFeatureFlagResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlagResponse'
        totalElements:
          type: integer
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
