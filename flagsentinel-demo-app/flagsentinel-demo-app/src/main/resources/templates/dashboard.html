<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Flag Sentinel Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                bg:"#060b16",
                panel:"#0b1220",
                border:"#1e293b"
              },
              boxShadow:{
                panel3d:"0 25px 60px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.15), 0 0 40px rgba(255,255,255,.25)"
              }
            }
          }
        }
    </script>
</head>

<body class="bg-bg text-gray-200 min-h-screen flex flex-col">

<header class="bg-black px-6 py-4 flex justify-between items-center">

    <div class="flex items-center gap-3 text-xl font-semibold">
        <span id="ws-status" class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
        Flag Sentinel
    </div>

    <div class="flex gap-8 text-sm">

        <div class="text-center">
            <div id="kpi-total" class="text-lg font-semibold">0</div>
            <div class="text-gray-400">Flags</div>
        </div>

        <div class="text-center">
            <div id="kpi-enabled" class="text-lg font-semibold text-green-400">0</div>
            <div class="text-gray-400">Enabled</div>
        </div>

        <div class="text-center">
            <div id="kpi-rules" class="text-lg font-semibold text-indigo-400">0</div>
            <div class="text-gray-400">Rules</div>
        </div>

    </div>

</header>

<div class="flex-1 flex flex-col p-5 gap-5 overflow-hidden">

    <div class="flex gap-5 flex-1 overflow-hidden">

        <!-- FLAGS -->
        <div class="flex-1 bg-panel rounded-xl border border-border shadow-panel3d flex flex-col overflow-hidden">

            <div class="p-4 flex justify-between items-center border-b border-border">
                <h2 class="font-semibold">Feature Flags</h2>

                <button id="flags-reset"
                        class="p-2 rounded-lg border border-border hover:bg-indigo-500/20 transition group">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         class="w-5 h-5 text-gray-300 group-hover:text-white group-hover:rotate-180 transition duration-500"
                         fill="none" viewBox="0 0 24 24" stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M4 4v6h6M20 20v-6h-6M5 19a9 9 0 0114-14"/>
                    </svg>

                </button>
            </div>

            <div class="flex-1 overflow-y-auto">
                <table class="w-full text-sm">
                    <thead class="sticky top-0 bg-panel border-b border-border">
                    <tr>
                        <th class="py-3 px-4 text-left">Flag</th>
                        <th class="py-3 text-center">Enabled</th>
                    </tr>
                    </thead>
                    <tbody id="flags-body"></tbody>
                </table>
            </div>

            <div class="p-3 flex justify-between text-xs border-t border-border">
                <button id="flags-prev">◀</button>
                <span id="flags-page"></span>
                <button id="flags-next">▶</button>
            </div>

        </div>

        <!-- RULES -->
        <div class="flex-1 bg-panel rounded-xl border border-border shadow-panel3d flex flex-col overflow-hidden">

            <div class="p-4 border-b border-border font-semibold">Rules</div>

            <div class="flex-1 overflow-y-auto">
                <table class="w-full text-sm">
                    <thead class="sticky top-0 bg-panel border-b border-border">
                    <tr>
                        <th class="py-3 px-4 text-left">Attribute</th>
                        <th class="py-3 text-center">Operator</th>
                        <th class="py-3 text-center">Value</th>
                    </tr>
                    </thead>
                    <tbody id="rules-body"></tbody>
                </table>
            </div>

            <div class="p-3 flex justify-between text-xs border-t border-border">
                <button id="rules-prev">◀</button>
                <span id="rules-page"></span>
                <button id="rules-next">▶</button>
            </div>

        </div>

    </div>

    <!-- EVENTS -->
    <div class="h-56 bg-panel rounded-xl border border-border shadow-panel3d flex flex-col">

        <div class="p-3 border-b border-border font-semibold">
            Live Events
        </div>

        <div id="events" class="flex-1 overflow-y-auto p-3 font-mono text-sm space-y-1 text-left"></div>

    </div>

</div>

<footer class="text-xs text-gray-500 px-4 py-2 border-t border-border">
    Flag Sentinel · Demo UI
</footer>

<script>
    let allFlags=[],allRules=[],selectedFlagRules=null,selectedFlagCode=null;
    let flagsPage=1,rulesPage=1;
    const pageSize=5;

    function updateKPIs(){
      document.getElementById("kpi-total").textContent=allFlags.length;
      document.getElementById("kpi-enabled").textContent=allFlags.filter(f=>f.enabled).length;
      document.getElementById("kpi-rules").textContent=allRules.length;
    }

    function renderFlags(){
      const body=document.getElementById("flags-body");
      body.innerHTML="";
      const total=Math.ceil(allFlags.length/pageSize)||1;
      if(flagsPage>total)flagsPage=total;

      allFlags.slice((flagsPage-1)*pageSize,flagsPage*pageSize).forEach(f=>{
        const tr=document.createElement("tr");
        tr.className="border-b border-border cursor-pointer "+
          (selectedFlagCode===f.flagCode?"bg-indigo-600/20":"hover:bg-gray-700");

        tr.innerHTML=`
          <td class="py-2 px-4 text-left">${f.flagCode}</td>
          <td class="py-2 text-center">${f.enabled?"✔":"✘"}</td>`;

        tr.onclick=()=>{
          selectedFlagCode=f.flagCode;
          selectedFlagRules=f.rules||[];
          rulesPage=1;
          renderFlags();
          renderRulesFiltered();
        };

        body.appendChild(tr);
      });

      document.getElementById("flags-page").textContent=`${flagsPage}/${total}`;
    }

    function renderRules(rules){
      const body=document.getElementById("rules-body");
      body.innerHTML="";
      const total=Math.ceil(rules.length/pageSize)||1;
      if(rulesPage>total)rulesPage=total;

      rules.slice((rulesPage-1)*pageSize,rulesPage*pageSize).forEach(r=>{
        body.innerHTML+=`
        <tr class="border-b border-border">
          <td class="py-2 px-4 text-left">${r.attribute}</td>
          <td class="py-2 text-center">${r.operator}</td>
          <td class="py-2 text-center">${r.value}</td>
        </tr>`;
      });

      document.getElementById("rules-page").textContent=`${rulesPage}/${total}`;
    }

    function renderRulesFiltered(){
      if(!selectedFlagRules)return renderRules(allRules);
      renderRules(allRules.filter(r=>selectedFlagRules.includes(r.id)));
    }

    async function loadFlags(){allFlags=await (await fetch("/dashboard/flags")).json();updateKPIs();renderFlags();}
    async function loadRules(){allRules=await (await fetch("/dashboard/rules")).json();updateKPIs();renderRulesFiltered();}
    async function loadStatus(){const d=await (await fetch("/dashboard/status")).json();document.getElementById("ws-status").className="w-3 h-3 rounded-full "+(d.connected?"bg-green-400":"bg-red-500");}
    async function loadEvents(){const e=await (await fetch("/dashboard/events")).json();const c=document.getElementById("events");c.innerHTML="";e.forEach(ev=>c.innerHTML+=`<div class="${ev.type==="WARN"?"text-orange-400":"text-blue-400"}"><span class="text-gray-500">${new Date(ev.timestamp).toLocaleTimeString()}</span> ${ev.message}</div>`);}

    document.getElementById("flags-prev").onclick=()=>{if(flagsPage>1){flagsPage--;renderFlags();}};
    document.getElementById("flags-next").onclick=()=>{if(flagsPage<Math.ceil(allFlags.length/pageSize)){flagsPage++;renderFlags();}};
    document.getElementById("rules-prev").onclick=()=>{if(rulesPage>1){rulesPage--;renderRulesFiltered();}};
    document.getElementById("rules-next").onclick=()=>{const r=selectedFlagRules?allRules.filter(x=>selectedFlagRules.includes(x.id)):allRules;if(rulesPage<Math.ceil(r.length/pageSize)){rulesPage++;renderRulesFiltered();}};
    document.getElementById("flags-reset").onclick=()=>{selectedFlagRules=null;selectedFlagCode=null;flagsPage=1;rulesPage=1;renderFlags();renderRules(allRules);};

    setInterval(()=>{loadStatus();loadFlags();loadRules();loadEvents();},20000);
    loadStatus();loadFlags();loadRules();loadEvents();
</script>

</body>
</html>
